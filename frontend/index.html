<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>日切放行</title>
<script src="/static/vue.global.prod.js"></script>
<style>
  :root{--bg:#0b1220;--panel:#121a2b;--line:#243049;--text:#e8eefc;--muted:#93a0b8;--ok:#3ddc97;--bad:#ff6b6b;--accent:#4cc9f0}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .top{display:flex;align-items:center;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line);background:#0e1626}
  .brand{font-weight:700;letter-spacing:.08em;font-size:18px}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:.02em;margin-top:2px}
  .tabs{display:flex;gap:6px;flex:1}
  .tabs button{background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}
  .tabs button.on{color:var(--text);border-color:var(--line);background:#18233a}
  .user{color:var(--muted);font-size:13px}
  .ghost{background:#18233a;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer}
  main{padding:18px 20px 28px}
  .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  h2{margin:0 0 10px;font-size:15px;color:#c9d4ea}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600}
  input,select{width:100%;background:#0b1220;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;margin:4px 0 10px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .primary{background:var(--accent);color:#041018;border:0;padding:9px 12px;border-radius:8px;font-weight:700;cursor:pointer}
  .mono{font-family:Consolas,"Courier New",monospace}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#1b2a22;color:var(--ok)}
  .tag.bad{background:#2a1518;color:var(--bad)}
  .tag.warn{background:#2a2415;color:#ffd166}
  .login{max-width:400px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
  .err{color:var(--bad);min-height:18px;font-size:13px}
  .ok{color:var(--ok);min-height:18px;font-size:13px}
  .muted{color:var(--muted);font-size:12px}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .kpi .panel{padding:12px}.kpi b{display:block;font-size:22px;margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);margin-left:4px}
  .chip.bad{border-color:#5b2121;color:var(--bad)}.chip.bad b{color:var(--bad)}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:4px 0 10px}
  .check input{width:auto;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;background:#b91c1c;color:#fff">需要启用 JavaScript</p></noscript>
<div id="boot-hint" style="display:none;padding:24px;font-family:sans-serif;background:#fef3c7;color:#111">页面脚本未加载。请确认可访问 /static/vue.global.prod.js</div>
<script>
setTimeout(function () {
  if (!window.Vue) {
    var e = document.getElementById("boot-hint");
    if (e) e.style.display = "block";
  }
}, 800);
</script>

<script>
const {createApp,ref,onMounted,computed}=Vue;
createApp({
  setup(){
    const token=ref(localStorage.getItem('slicegate_token')||'');
    const user=ref(localStorage.getItem('slicegate_user')||'');
    const username=ref('admin'), password=ref('123456'), err=ref(''), tab=ref(0), actionErr=ref(''), okMsg=ref('');
    const slices=ref([]), releases=ref([]), watermarks=ref([]);
    const notifications=ref([]), policy=ref(null), reconcile=ref(null);
    const policyMode=ref('甲'), mockFail=ref(false);
    const form=ref({slice_no:'SL-2026-11-03-east',biz_date:'2026-11-03',partition_key:'east',row_count:1000,expected_count:1000});
    const releaseSliceId=ref(1), consumer=ref('ads_order');
    const nav=['切片登记','完整度裁决','下游放行','消费水位','通知队列'];
    const completeCnt=computed(()=>slices.value.filter(s=>s.completeness==='完整').length);
    const openCnt=computed(()=>slices.value.filter(s=>s.release_status!=='已放行').length);
    const pendingCnt=computed(()=>notifications.value.filter(n=>n.status==='待投递'||n.status==='投递失败').length);
    function auth(){return {Authorization:'Bearer '+token.value,'Content-Type':'application/json'};}
    async function login(){
      err.value='';
      const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});
      const j=await r.json(); if(!r.ok){err.value=j.detail||'登录失败';return;}
      token.value=j.token; user.value=j.username;
      localStorage.setItem('slicegate_token',j.token); localStorage.setItem('slicegate_user',j.username);
      await refresh();
    }
    function logout(){token.value='';user.value='';localStorage.removeItem('slicegate_token');localStorage.removeItem('slicegate_user');}
    async function loadJson(url){
      const r=await fetch(url,{headers:auth()});
      const j=await r.json().catch(()=>({}));
      if(r.status===401){ logout(); return null; }
      return j;
    }
    async function refresh(){
      if(!token.value) return;
      const s=await loadJson('/api/slices'); if(s===null) return;
      slices.value=Array.isArray(s.items)?s.items:[];
      const rel=await loadJson('/api/releases'); if(rel===null) return;
      releases.value=Array.isArray(rel.items)?rel.items:[];
      const w=await loadJson('/api/watermarks'); if(w===null) return;
      watermarks.value=Array.isArray(w.items)?w.items:[];
      const nf=await loadJson('/api/notifications'); if(nf===null) return;
      notifications.value=Array.isArray(nf.items)?nf.items:[];
      policy.value=nf.policy||null;
      const rc=await loadJson('/api/reconcile'); if(rc===null) return;
      reconcile.value=rc;
      if(slices.value.length) releaseSliceId.value=slices.value[0].id;
    }
    async function createSlice(){actionErr.value='';okMsg.value='';const r=await fetch('/api/slices',{method:'POST',headers:auth(),body:JSON.stringify(form.value)});const j=await r.json();if(!r.ok)actionErr.value=j.detail||'失败';await refresh();}
    async function evaluate(id){await fetch('/api/slices/'+id+'/evaluate',{method:'POST',headers:auth()});await refresh();}
    async function doRelease(){
      actionErr.value='';okMsg.value='';
      const r=await fetch('/api/slices/'+releaseSliceId.value+'/release',{method:'POST',headers:auth(),body:JSON.stringify({consumer:consumer.value})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){actionErr.value=j.detail||'放行失败';}
      else{okMsg.value='放行成功：通知#'+j.notification_id+' 已随同事务落账（'+j.notification_status+'·口径'+j.mode+'），待值班投递';}
      await refresh();
    }
    async function savePolicy(){
      actionErr.value='';okMsg.value='';
      const r=await fetch('/api/notifications/policy',{method:'PUT',headers:auth(),body:JSON.stringify({mode:policyMode.value})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){actionErr.value=j.detail||'失败';}
      else{okMsg.value=j.note||'口径既定，未变更';}
      await refresh();
    }
    async function dispatch(n){
      actionErr.value='';okMsg.value='';
      const r=await fetch('/api/notifications/'+n.id+'/dispatch',{method:'POST',headers:auth(),body:JSON.stringify({simulate_failure:mockFail.value})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){actionErr.value=j.detail||'投递失败';}
      else{okMsg.value='通知#'+n.id+' 已投递（第'+j.attempt+'次，口径'+j.mode+'）';}
      await refresh();
    }
    onMounted(()=>{if(token.value)refresh();});
    return {token,user,username,password,err,tab,nav,slices,releases,watermarks,notifications,policy,reconcile,policyMode,mockFail,form,releaseSliceId,consumer,actionErr,okMsg,completeCnt,openCnt,pendingCnt,login,logout,createSlice,evaluate,doRelease,savePolicy,dispatch};
  },
  template:`
  <div v-if="!token" class="login">
    <div class="brand">日切放行<small>分区切片完整度闸 · 本地 SQLite</small></div>
    <label>用户名</label><input v-model="username"/><label>密码</label><input type="password" v-model="password"/>
    <div class="err">{{err}}</div><button class="primary" style="width:100%" @click="login">进入控制台</button>
  </div>
  <div v-if="token">
    <div class="top">
      <div class="brand">日切放行<small>切片 → 完整度 → 放行 → 水位 → 通知投递闭环</small></div>
      <div class="tabs"><button v-for="(n,i) in nav" :key="n" :class="{on:tab===i}" @click="tab=i">{{n}}</button></div>
      <div class="user">{{user}}</div><button class="ghost" @click="logout">退出</button>
    </div>
    <main>
      <div class="kpi">
        <div class="panel">切片总数<b class="mono">{{slices.length}}</b></div>
        <div class="panel">已完整<b class="mono">{{completeCnt}}</b></div>
        <div class="panel">待投递通知<b class="mono">{{pendingCnt}}</b></div>
      </div>
      <div v-show="tab===0" class="grid">
        <div class="panel">
          <h2>在途切片</h2>
          <table><thead><tr><th>切片号</th><th>日/区</th><th>实收</th><th>完整度</th><th></th></tr></thead>
          <tbody><tr v-for="s in slices" :key="s.id">
            <td class="mono">{{s.slice_no}}</td><td>{{s.biz_date}} / {{s.partition_key}}</td>
            <td class="mono">{{s.row_count}}/{{s.expected_count}}</td>
            <td><span class="tag" :class="{bad:s.completeness!=='完整'}">{{s.completeness}}</span></td>
            <td><button class="ghost" @click="evaluate(s.id)">重裁</button></td>
          </tr></tbody></table>
        </div>
        <div class="panel">
          <h2>登记切片</h2>
          <div class="row"><div><label>切片号</label><input v-model="form.slice_no"/></div><div><label>业务日</label><input v-model="form.biz_date"/></div></div>
          <div class="row"><div><label>分区</label><input v-model="form.partition_key"/></div><div><label>实收</label><input type="number" v-model.number="form.row_count"/></div></div>
          <label>期望</label><input type="number" v-model.number="form.expected_count"/>
          <button class="primary" @click="createSlice">写入登记</button>
          <div class="err">{{actionErr}}</div>
        </div>
      </div>
      <div v-show="tab===1" class="panel">
        <h2>完整度裁决</h2>
        <table><thead><tr><th>切片</th><th>缺口</th><th>结论</th><th>放行态</th></tr></thead>
        <tbody><tr v-for="s in slices" :key="'c'+s.id">
          <td class="mono">{{s.slice_no}}</td><td class="mono">{{Math.max(s.expected_count-s.row_count,0)}}</td>
          <td>{{s.completeness}}</td><td>{{s.release_status}}</td>
        </tr></tbody></table>
      </div>
      <div v-show="tab===2" class="grid">
        <div class="panel">
          <h2>申请放行</h2>
          <label>切片</label><select v-model.number="releaseSliceId"><option v-for="s in slices" :value="s.id">{{s.slice_no}}（{{s.completeness}}）</option></select>
          <label>下游</label><input v-model="consumer"/>
          <button class="primary" @click="doRelease">放行</button>
          <div class="muted">口径甲：成功放行、推水位、落待投递通知同一事务，任一步失败整笔回滚</div>
          <div class="err">{{actionErr}}</div><div class="ok">{{okMsg}}</div>
        </div>
        <div class="panel">
          <h2>放行流水</h2>
          <table><thead><tr><th>切片</th><th>下游</th><th>结果</th><th>通知账</th><th>时间</th></tr></thead>
          <tbody><tr v-for="r in releases" :key="r.id"><td class="mono">{{r.slice_no}}</td><td>{{r.consumer}}</td><td>{{r.status}}</td>
            <td><span v-if="r.notification_status" class="tag" :class="{bad:r.notification_status==='投递失败',warn:r.notification_status==='待投递'}">{{r.notification_status}}·{{r.notification_mode}}</span><span v-else>—</span></td>
            <td class="mono">{{r.created_at}}</td></tr></tbody></table>
        </div>
      </div>
      <div v-show="tab===3" class="panel">
        <h2>消费水位</h2>
        <table><thead><tr><th>消费方</th><th>业务日</th><th>水位</th><th>来源切片</th></tr></thead>
        <tbody><tr v-for="w in watermarks" :key="w.id"><td>{{w.consumer}}</td><td>{{w.biz_date}}</td><td class="mono">{{w.watermark}}</td><td class="mono">{{w.source_slice}}</td></tr></tbody></table>
      </div>
      <div v-show="tab===4">
        <div class="grid">
          <div class="panel">
            <h2>通知策略簿</h2>
            <div v-if="policy">
              <div class="chips"><span class="chip">当前口径<b>{{policy.mode}}</b></span><span class="chip">定口人<b>{{policy.decided_by}}</b></span><span class="chip">定口日<b class="mono">{{policy.decided_day}}</b></span></div>
              <div class="muted" style="margin-bottom:8px">{{policy.mode_desc}}</div>
              <div class="muted" style="margin-bottom:8px">选定已写进策略簿，当天不许换；偏离策略簿即拒并写明「通知口径偏了」。</div>
            </div>
            <label>申请口径</label>
            <select v-model="policyMode"><option value="甲">甲 · 同事务落账</option><option value="乙">乙 · 独立投递队列</option></select>
            <button class="primary" @click="savePolicy">写入策略簿</button>
            <div class="err">{{actionErr}}</div><div class="ok">{{okMsg}}</div>
          </div>
          <div class="panel">
            <h2>账实对账（队列 × 策略 × 放行 × 水位）</h2>
            <div v-if="reconcile" class="chips">
              <span class="chip">成功放行<b>{{reconcile.summary['成功放行数']}}</b></span>
              <span class="chip">通知账<b>{{reconcile.summary['通知账数']}}</b></span>
              <span class="chip">已投递<b>{{reconcile.summary['已投递']}}</b></span>
              <span class="chip">待投递<b>{{reconcile.summary['待投递']}}</b></span>
              <span class="chip">投递失败<b>{{reconcile.summary['投递失败']}}</b></span>
              <span class="chip">水位账<b>{{reconcile.summary['水位账数']}}</b></span>
              <span class="chip" :class="{bad:reconcile.summary['异常数']>0}">异常<b>{{reconcile.summary['异常数']}}</b></span>
            </div>
            <table v-if="reconcile"><thead><tr><th>切片</th><th>下游</th><th>通知态</th><th>口径</th><th>水位</th><th>核对</th></tr></thead>
            <tbody><tr v-for="r in reconcile.rows" :key="r.release_id">
              <td class="mono">{{r.slice_no}}</td><td>{{r.consumer}}</td>
              <td>{{r.notification_status||'—'}}</td><td>{{r.notification_mode||'—'}}</td>
              <td class="mono">{{r.watermark||'—'}}</td>
              <td><span class="tag" :class="{bad:!r.ok}">{{r.ok?'账实相符':r.issues.join('；')}}</span></td>
            </tr></tbody></table>
          </div>
        </div>
        <div class="panel" style="margin-top:14px">
          <h2>通知队列</h2>
          <label class="check"><input type="checkbox" v-model="mockFail"/> 演练：模拟下游无回执（失败记失败账、可重试，绝不把未投递标成已通知）</label>
          <table><thead><tr><th>通知</th><th>切片</th><th>下游</th><th>状态</th><th>口径旁注</th><th>尝试</th><th>经手值班</th><th>投递时间</th><th>最近错误</th><th></th></tr></thead>
          <tbody><tr v-for="n in notifications" :key="n.id">
            <td class="mono">#{{n.id}}</td><td class="mono">{{n.slice_no}}</td><td>{{n.consumer}}</td>
            <td><span class="tag" :class="{bad:n.status==='投递失败',warn:n.status==='待投递'||n.status==='投递中'}">{{n.status}}</span></td>
            <td>{{n.mode}}</td><td class="mono">{{n.attempts}}</td><td>{{n.claimed_by||'—'}}</td>
            <td class="mono">{{n.delivered_at||'—'}}</td><td>{{n.last_error||'—'}}</td>
            <td><button class="ghost" v-if="n.status==='待投递'||n.status==='投递失败'" @click="dispatch(n)">投递</button></td>
          </tr></tbody></table>
        </div>
      </div>
    </main>
  </div>`
}).mount('#app');
</script>
</body>
</html>
